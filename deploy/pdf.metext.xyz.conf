# nginx site for 阿搜PDF工具箱 (pdf.metext.xyz) — DRAFT, not deployed.
# Upload dist/ to /var/www/pdf.metext.xyz . HTTP only for now; add the
# 443 server (certbot / Aliyun cert) later and switch on HSTS there.

# Extra MIME types not in older mime.types
types {
    application/wasm                wasm;
    application/manifest+json       webmanifest;
    application/javascript          mjs;
    font/otf                        otf;
    font/ttf                        ttf;
    font/woff2                      woff2;
    application/octet-stream        traineddata;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdf.metext.xyz;

    root  /var/www/pdf.metext.xyz;
    index index.html;
    charset utf-8;

    # Large PDFs are processed in the browser; nothing is uploaded.
    client_max_body_size 1m;
    server_tokens off;

    # ---- compression: serve precompressed *.gz built by COMPRESSION_MODE=g
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript application/manifest+json image/svg+xml
               application/wasm font/otf font/ttf;

    # ---- security headers (mirrors security-headers.conf from the build)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # Needed for SharedArrayBuffer (LibreOffice / multithreaded wasm)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Optional: paste the Content-Security-Policy line from the build's
    # security-headers.conf here once verified on staging.
    # include /etc/nginx/snippets/pdf.metext.xyz-csp.conf;

    # ---- routing
    location = / { try_files /index.html =404; }

    # Pretty URLs: /merge-pdf -> merge-pdf.html, /zh/ -> zh/index.html
    # (add_header in a location replaces server-level headers, so repeat them)
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Upstream pages removed in this build
    location ~ ^/(?:[a-z]{2}(?:-TW)?/)?(?:kura|hyper-compress|blog)(?:/.*)?$ {
        return 301 /;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- caching
    # Hashed bundles: immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Self-hosted wasm / OCR / fonts (versioned by package, large)
    location /wasm/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # *.traineddata.gz is already gzip data; serve it as-is
        location ~ \.traineddata\.gz$ {
            gzip off;
            gzip_static off;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=2592000" always;
        }
    }

    location ~* \.(?:wasm|data)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # HTML, service worker, manifest, locales: always revalidate
    location ~* (?:\.html|/sw\.js|\.webmanifest|/locales/.*\.json)$ {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Never serve build leftovers / dotfiles
    location ~ /\.(?!well-known) { deny all; }
    location = /_headers { deny all; }
}
